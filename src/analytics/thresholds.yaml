# Minimum volume for Z-score peer comparisons (season totals)
# Leaderboard minimums: see config/settings.yaml.
# MLB hitters use plate appearances; MLB pitchers use innings-pitched gates.
#
# Volume gates below are configurable heuristics (not from an external study).
# Goal: exclude low-usage players from peer cohorts so Z-scores are meaningful.
# Tune in this file as you validate against real seasons.
#
# Weekly boom/bust P25/P75 uses the same gates prorated per week (season gate / 17 REG weeks)
# so only player-weeks with starter-like usage count toward the position distribution.

min_qualified_peers: 10

# Minimum preseason ECR rows stored for a season before beat-draft-rank UI appears.
min_ecr_rows_per_season: 50

volume_gates:
  QB:
    passing_attempts: 200   # ~12 attempts/game over a full starter season
  RB:
    carries: 100            # ~6 carries/game
  WR:
    targets: 50             # opportunity-based (preferred over receptions)
  TE:
    targets: 40
  K:
    games: 8
  default:
    games: 8

# Sport-specific peer Z gates (sidebar min games still applies to leaderboards).
volume_gates_by_sport:
  nba:
    default:
      games: 41             # ~50% of 82-game season
    PG:
      games: 41
    SG:
      games: 41
    SF:
      games: 41
    PF:
      games: 41
    C:
      games: 41
  mlb:
    default:
      plate_appearances: 200
    SP:
      innings_pitched: 50
    RP:
      innings_pitched: 20
  nhl:
    default:
      games: 41             # ~50% of 82-game season
    G:
      games: 20

# Regular-season weeks used to prorate volume gates for weekly surprise / boom-bust.
weeks_per_regular_season_by_sport:
  nfl: 17
  nba: 26
  mlb: 27
  nhl: 26
